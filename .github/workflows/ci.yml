name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest tests -q
      - name: Smoke-install the built wheel in a clean environment
        run: |
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install -q dist/*.whl
          /tmp/clean/bin/python -c "import sreval; print(sreval.__version__)"
      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py
